name: tiendaapp
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.8.1
  barcode_widget: ^2.0.4
  collection: ^1.19.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon_app/
    - assets/audios/


flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon_app/icon_tienda_app.jpg"
  min_sdk_android: 21
